<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KaiFlix Admin Panel</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px;
      background: #0b1020;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    main {
      max-width: 520px;
      margin: auto;
      background: #151c30;
      padding: 22px;
      border-radius: 14px;
    }
    h1 { color: #56c8ff; }
    label { display: block; margin-top: 14px; }
    input, select, button {
      width: 100%;
      padding: 12px;
      margin-top: 7px;
      border: 1px solid #39445e;
      border-radius: 8px;
      font-size: 16px;
    }
    input, select {
      background: #0b1020;
      color: white;
    }
    button {
      margin-top: 20px;
      background: #1689d8;
      color: white;
      border: 0;
      font-weight: bold;
    }
    button:disabled { opacity: .6; }
    #status { overflow-wrap: anywhere; }
    a { color: #56c8ff; }
  </style>
</head>
<body>
<main>
  <h1>KaiFlix Admin</h1>
  <p>Add a title to the KaiFlix database.</p>

  <form id="titleForm">
    <label>Admin Password
      <input id="password" type="password" required
        autocomplete="current-password">
    </label>

    <label>Title
      <input id="title" required maxlength="200">
    </label>

    <label>Category
      <select id="category" required>
        <option value="Movie">Movie</option>
        <option value="TV Series">TV Series</option>
        <option value="Anime">Anime</option>
      </select>
    </label>

    <label>Year
      <input id="year" type="number" min="1888" max="2100">
    </label>

    <label>Poster URL
      <input id="poster" type="url" placeholder="https://...">
    </label>

    <label>Watch Link
      <input id="watch" type="url" placeholder="https://...">
    </label>

    <label>Download Link
      <input id="download" type="url" placeholder="https://...">
    </label>

    <button id="saveButton" type="submit">Save Title</button>
  </form>

  <p id="status" role="status"></p>
  <p><a href="/">Open KaiFlix Website</a></p>
</main>

<script>
  const form = document.getElementById("titleForm");
  const button = document.getElementById("saveButton");
  const status = document.getElementById("status");

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    button.disabled = true;
    status.textContent = "Saving...";

    const data = {
      title: document.getElementById("title").value.trim(),
      category: document.getElementById("category").value,
      year: document.getElementById("year").value || null,
      poster_url: document.getElementById("poster").value.trim() || null,
      watch_url: document.getElementById("watch").value.trim() || null,
      download_url: document.getElementById("download").value.trim() || null
    };

    try {
      const response = await fetch("/api/titles", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-Admin-Password": document.getElementById("password").value
        },
        body: JSON.stringify(data)
      });

      const result = await response.json();

      if (!response.ok) {
        throw new Error(
          response.status === 401
            ? "Incorrect password or ADMIN_PASSWORD secret is not configured correctly."
            : result.error || "Could not save title."
        );
      }

      status.textContent = "Saved successfully! Title ID: " + result.id;
      form.reset();
    } catch (error) {
      status.textContent = "Error: " + error.message;
    } finally {
      button.disabled = false;
    }
  });
</script>
</body>
          </html>
