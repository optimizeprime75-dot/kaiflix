
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b14">
<title>KaiFlix | Movies, Series & Anime</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080b14;color:#fff;font-family:Arial,sans-serif}
header{padding:18px 5%;background:#111827;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid #202b3d}
.logo{font-size:27px;font-weight:bold;color:#42a5ff}
nav{display:flex;gap:15px;flex-wrap:wrap}
nav a{color:#ddd;text-decoration:none;font-size:14px}
nav a:hover{color:#42a5ff}
.hero{padding:45px 5%;background:linear-gradient(120deg,#102647,#080b14)}
.hero h1{font-size:clamp(28px,5vw,40px);margin:0 0 12px;line-height:1.2}
.hero p{color:#c4cede;line-height:1.6}
.search{width:100%;max-width:500px;padding:14px;border-radius:9px;border:1px solid #34435b;background:#111827;color:white;font-size:16px;outline:none}
.search:focus{border-color:#1685ff}
main{padding:24px 5%;min-height:45vh}
h2{margin:0 0 16px}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 25px}
.filters button{padding:10px 15px;border:0;border-radius:20px;background:#202b3d;color:white;cursor:pointer}
.filters button.active{background:#1685ff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:17px}
.card{background:#111827;border-radius:12px;overflow:hidden;border:1px solid #202b3d;min-width:0;transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-3px);border-color:#1685ff}
.poster{aspect-ratio:2/3;background:linear-gradient(145deg,#172b48,#101522);display:flex;align-items:center;justify-content:center;color:#a9bdd8;text-align:center;overflow:hidden;position:relative}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.poster-fallback{padding:12px;font-size:14px;line-height:1.5;overflow-wrap:anywhere}
.info{padding:12px}
.info h3{font-size:16px;margin:0 0 8px;overflow-wrap:anywhere;line-height:1.4}
.info p{font-size:12px;color:#aebbd0;line-height:1.5;overflow-wrap:anywhere}
.info a{display:block;width:100%;text-align:center;background:#1685ff;color:white;text-decoration:none;padding:10px;border:0;border-radius:7px;margin-top:8px;font-size:13px}
.info a:hover{filter:brightness(1.12)}
.info a.download{background:#26364e}
#status{color:#aebbd0;font-size:14px;line-height:1.5}
#empty{padding:20px 0;color:#aebbd0}
footer{text-align:center;padding:25px;color:#8b98ac;border-top:1px solid #202b3d;font-size:13px}
@media(max-width:480px){
 header{padding:16px 4%}
 .logo{font-size:24px}
 nav{gap:10px}
 nav a{font-size:13px}
 .hero{padding:35px 4%}
 main{padding:22px 4%}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
 .poster{aspect-ratio:2/3}
}
</style>
</head>
<body>

<header>
  <div class="logo">KaiFlix 🎬</div>
  <nav>
    <a href="#home">Home</a>
    <a href="#catalog" data-nav-cat="Movie">Movies</a>
    <a href="#catalog" data-nav-cat="TV Series">Series</a>
    <a href="#catalog" data-nav-cat="Anime">Anime</a>
  </nav>
</header>

<section class="hero" id="home">
  <h1>Unlimited Stories.<br>One Destination.</h1>
  <p>Discover Movies, TV Series &amp; Anime.</p>
  <input class="search" id="search" type="search"
    placeholder="Search your favourite title..."
    aria-label="Search titles">
</section>

<main id="catalog">
  <h2>Explore Catalog</h2>

  <div class="filters" aria-label="Filter by category">
    <button type="button" class="active" data-cat="All">All</button>
    <button type="button" data-cat="Movie">Movies</button>
    <button type="button" data-cat="TV Series">TV Series</button>
    <button type="button" data-cat="Anime">Anime</button>
  </div>

  <p id="status" role="status">Loading catalog...</p>
  <div class="grid" id="grid"></div>
  <p id="empty" hidden>No titles found. Try another search.</p>
</main>

<footer>© 2026 KaiFlix · Your entertainment hub</footer>

<script>
let titles=[];
let category="All";

const grid=document.getElementById("grid");
const search=document.getElementById("search");
const status=document.getElementById("status");
const empty=document.getElementById("empty");

function safeUrl(value){
  if(!value) return "";
  try{
    const u=new URL(value);
    return ["http:","https:"].includes(u.protocol)?u.href:"";
  }catch{
    return "";
  }
}

function makeLink(url,label,className){
  const link=document.createElement("a");
  link.href=url;
  link.target="_blank";
  link.rel="noopener noreferrer";
  link.className=className;
  link.textContent=label;
  return link;
}

function render(){
  const q=search.value.toLowerCase().trim();

  const items=titles.filter(t=>
    (category==="All"||t.category===category)&&
    String(t.title||"").toLowerCase().includes(q)
  );

  grid.replaceChildren();

  for(const t of items){
    const card=document.createElement("article");
    card.className="card";

    const posterBox=document.createElement("div");
    posterBox.className="poster";

    const fallback=document.createElement("div");
    fallback.className="poster-fallback";
    fallback.textContent="🎬 Poster unavailable";
    posterBox.appendChild(fallback);

    const poster=safeUrl(t.poster_url);

    if(poster){
      const img=document.createElement("img");
      img.alt=(t.title||"Title")+" poster";
      img.loading="lazy";
      img.decoding="async";

      img.addEventListener("load",()=>{
        fallback.remove();
      },{once:true});

      img.addEventListener("error",()=>{
        img.remove();
        fallback.textContent="🎬 Poster unavailable";
      },{once:true});

      img.src=poster;
      posterBox.appendChild(img);
    }

    const info=document.createElement("div");
    info.className="info";

    const title=document.createElement("h3");
    title.textContent=t.title||"Untitled";
    info.appendChild(title);

    const meta=document.createElement("p");
    meta.textContent=[
      t.category||"Uncategorized",
      t.year||"Year unknown"
    ].join(" · ");
    info.appendChild(meta);

    const watch=safeUrl(t.watch_url);
    if(watch){
      info.appendChild(makeLink(watch,"▶ Watch","watch"));
    }

    const download=safeUrl(t.download_url);
    if(download){
      info.appendChild(makeLink(download,"↓ Download","download"));
    }

    card.append(posterBox,info);
    grid.appendChild(card);
  }

  empty.hidden=items.length>0;
}

async function loadTitles(){
  try{
    const response=await fetch("/api/titles");
    if(!response.ok) throw new Error("API returned "+response.status);

    const data=await response.json();
    titles=Array.isArray(data)?data:
      Array.isArray(data.titles)?data.titles:[];

    status.textContent=titles.length
      ?titles.length+" title(s) loaded"
      :"No titles in the catalog yet.";

    render();
  }catch(error){
    status.textContent="Could not load catalog. Please try again later.";
    console.error("KaiFlix catalog error:",error);
  }
}

document.querySelectorAll(".filters button").forEach(btn=>{
  btn.addEventListener("click",()=>{
    category=btn.dataset.cat;
    document.querySelectorAll(".filters button")
      .forEach(b=>b.classList.toggle("active",b===btn));
    render();
  });
});

document.querySelectorAll("[data-nav-cat]").forEach(link=>{
  link.addEventListener("click",()=>{
    category=link.dataset.navCat;
    document.querySelectorAll(".filters button")
      .forEach(b=>b.classList.toggle("active",b===link.dataset.navCat));
    render();
  });
});

search.addEventListener("input",render);
loadTitles();
</script>
</body>
</html>
